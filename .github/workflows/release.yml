name: Release desktop

on:
  push:
    tags:
      - '[0-9]*.*.*'
  workflow_dispatch:

concurrency:
  group: release-desktop-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Published GitHub releases (including prereleases) are immutable. CI can only
  # attach installers to a draft, so convert or replace any existing release first.
  prepare-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Ensure the GitHub Release is a draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}" 2>/dev/null || true)"
          if [ -z "$release_json" ]; then
            echo "No release for ${TAG_NAME}. electron-builder will create a draft."
            exit 0
          fi
          release_id="$(printf '%s' "$release_json" | jq -r .id)"
          is_draft="$(printf '%s' "$release_json" | jq -r .draft)"
          if [ "$is_draft" = "true" ]; then
            echo "Release ${release_id} is already a draft."
            exit 0
          fi
          echo "Release ${release_id} is published. Converting it to a draft."
          if gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" -f draft=true >/dev/null; then
            echo "Converted release ${release_id} to a draft."
            exit 0
          fi
          echo "Could not convert it. Deleting the published release (tag stays) so a draft can be created."
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}"

  package:
    needs: prepare-release
    if: always() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Require version tag
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.+-].*)?$ ]]; then
            echo "Tag must be a version such as 0.1.0 or 0.1.0-alpha.2 (no v prefix)."
            exit 1
          fi

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          node -e '
            const fs = require("fs")
            const version = process.env.TAG_NAME.replace(/^v/i, "")
            const path = "package.json"
            const pkg = JSON.parse(fs.readFileSync(path, "utf8"))
            pkg.version = version
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n")
          '

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # electron-builder does not read GITHUB_REF; this marks the job as a tag build
          # so the GitHub Release uses the same tag (0.1.0, 0.1.0-alpha.2).
          CI_BUILD_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          pnpm build
          pnpm exec electron-builder --publish always
