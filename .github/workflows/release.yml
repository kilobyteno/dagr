name: Release desktop

on:
  push:
    tags:
      - '[0-9]*.*.*'
  workflow_dispatch:

concurrency:
  group: release-desktop-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Require version tag
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.+-].*)?$ ]]; then
            echo "Tag must be a version such as 0.1.0 or 0.1.0-alpha.2 (no v prefix)."
            exit 1
          fi

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          node -e '
            const fs = require("fs")
            const version = process.env.TAG_NAME.replace(/^v/i, "")
            const path = "package.json"
            const pkg = JSON.parse(fs.readFileSync(path, "utf8"))
            pkg.version = version
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n")
          '

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # electron-builder does not read GITHUB_REF; this marks the job as a tag build
          # so the GitHub Release uses the same tag (0.1.0, 0.1.0-alpha.2).
          CI_BUILD_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          pnpm build
          pnpm exec electron-builder --publish always
