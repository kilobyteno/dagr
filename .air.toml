# Air: https://github.com/air-verse/air
# Usage: make run-watch

root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/dagr"
  cmd = "go build -o ./tmp/dagr ./cmd/server"
  delay = 500
  exclude_dir = ["assets", "tmp", "vendor", "web", "docs", "bin", "deploy", "node_modules", ".git"]
  exclude_regex = ["_test\\.go"]
  exclude_unchanged = true
  include_ext = ["go"]
  kill_delay = "1s"
  send_interrupt = true
  stop_on_error = true

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
