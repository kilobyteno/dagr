<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';" />
    <title>Dagr</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      .app-boot {
        position: relative;
        display: flex;
        height: 100%;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #faf7f4;
        color: #171717;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .app-boot::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(90% 70% at 50% 20%, rgba(242, 103, 34, 0.32), transparent 58%),
          radial-gradient(80% 60% at 80% 90%, rgba(242, 103, 34, 0.16), transparent 55%);
        pointer-events: none;
      }
      @media (prefers-color-scheme: dark) {
        .app-boot {
          background: #1f1a17;
          color: #f5f5f5;
        }
        .app-boot::before {
          background:
            radial-gradient(90% 70% at 50% 20%, rgba(242, 103, 34, 0.28), transparent 58%),
            radial-gradient(80% 60% at 80% 90%, rgba(242, 103, 34, 0.14), transparent 55%);
        }
        .app-boot-mark {
          filter: invert(1);
        }
        .app-boot-label {
          color: rgba(245, 245, 245, 0.65) !important;
        }
        .app-boot-bar {
          background: rgba(255, 255, 255, 0.12) !important;
        }
      }
      .app-boot-inner {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.15rem;
      }
      .app-boot-mark {
        width: 3.5rem;
        height: 3.5rem;
        border-radius: 0.375rem;
        display: block;
        object-fit: cover;
      }
      .app-boot-title {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .app-boot-label {
        margin: 0;
        font-size: 0.875rem;
        color: rgba(23, 23, 23, 0.55);
      }
      .app-boot-bar {
        width: 7rem;
        height: 0.125rem;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(0, 0, 0, 0.08);
      }
      .app-boot-bar > span {
        display: block;
        width: 50%;
        height: 100%;
        border-radius: 999px;
        background: #f26722;
        animation: dagr-boot-bar 1.2s ease-in-out infinite;
      }
      @keyframes dagr-boot-bar {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(240%); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-boot" role="status" aria-live="polite" aria-busy="true">
        <div class="app-boot-inner">
          <img class="app-boot-mark" src="/app-icon.png" width="56" height="56" alt="" draggable="false" aria-hidden="true" />
          <p class="app-boot-title">Dagr</p>
          <p class="app-boot-label">Starting Dagr…</p>
          <div class="app-boot-bar" aria-hidden="true"><span></span></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
