services:
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    entrypoint: ["/dagr-migrate", "up"]
    environment:
      DATABASE_URL: postgres://dagr:dagr@postgres:5432/dagr?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  dagr:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8383:8383"
    environment:
      HTTP_ADDR: ":8383"
      PUBLIC_BASE_URL: http://localhost:4173
      DATABASE_URL: postgres://dagr:dagr@postgres:5432/dagr?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      PASSWORD_MIN_LENGTH: "12"
      PASSWORD_REQUIRE_UPPERCASE: "true"
      PASSWORD_REQUIRE_LOWERCASE: "true"
      PASSWORD_REQUIRE_NUMBER: "true"
      PASSWORD_REQUIRE_SYMBOL: "false"
      SESSION_TTL: "720h"
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: dagr
      S3_USE_SSL: "false"
      S3_REGION: us-east-1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      createbuckets:
        condition: service_completed_successfully
    restart: unless-stopped

  client:
    build:
      context: ..
      dockerfile: client/Dockerfile
      args:
        VITE_DAGR_DEFAULT_MODE: selfhosted
        VITE_DAGR_SELF_HOSTED_URL: http://localhost:8383
    ports:
      - "4173:80"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dagr
      POSTGRES_PASSWORD: dagr
      POSTGRES_DB: dagr
    ports:
      # Host 5433 avoids clashing with a local Postgres on 5432.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dagr -d dagr"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        echo 'waiting for minio...';
        sleep 1;
      done;
      mc mb --ignore-existing local/dagr;
      exit 0;
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
